name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: vcpkg

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.44
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qtsvg qtdeclarative
          cache: true

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=$PWD\vcpkg" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset windows-ci -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DDEVHUB_ENABLE_PACKAGING=ON

      - name: Build
        run: cmake --build --preset windows-ci-release --parallel

      - name: Test
        shell: pwsh
        run: |
          ctest --preset windows-ci-release
          $ctestExitCode = $LASTEXITCODE
          if ($ctestExitCode -ne 0) {
            Get-ChildItem -Path out/build/windows-ci/tests/Release -Filter '*-tests.txt' | ForEach-Object {
              Write-Host ('::group::' + $_.Name)
              Get-Content -LiteralPath $_.FullName
              Write-Host '::endgroup::'
            }
          }
          exit $ctestExitCode

      - name: Stage Release runtime
        shell: pwsh
        run: cmake --install out/build/windows-ci --config Release --prefix "$env:GITHUB_WORKSPACE/out/ci-runtime"

      - name: Test packaged SQLite and QML startup
        shell: pwsh
        run: ./tests/packaged_runtime_test.ps1 -StageDirectory out/ci-runtime -ReportDirectory out/ci-runtime-reports

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-diagnostics
          path: |
            out/ci-runtime-reports/*.txt
            out/build/windows-ci/tests/Release/*-tests.txt
            out/build/windows-ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
