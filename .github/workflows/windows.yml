name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: vcpkg

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.44
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qtsvg
          cache: true

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=$PWD\vcpkg" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset windows-ci -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build --preset windows-ci-release --parallel

      - name: Test
        run: ctest --preset windows-ci-release
